<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="720" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#111">Smart Keyboard — System Architecture (SWE015 · UC5)</text>

  <!-- OFFLINE SECTION -->
  <rect x="24" y="60" width="992" height="256" rx="10" fill="#f3f6fb" stroke="#c9d6e8"/>
  <text x="44" y="88" font-size="16" font-weight="700" fill="#2b5fa8">OFFLINE — Training &amp; Evaluation (same held-out text)</text>

  <rect x="44" y="110" width="170" height="86" rx="8" fill="#ffffff" stroke="#7a99c4"/>
  <text x="129" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Gutenberg corpus</text>
  <text x="129" y="160" text-anchor="middle" font-size="12" fill="#555">classic English lit</text>
  <text x="129" y="177" text-anchor="middle" font-size="12" fill="#555">~900k words · 90/10 split</text>

  <!-- four models -->
  <rect x="300" y="104" width="300" height="42" rx="6" fill="#ffffff" stroke="#7a99c4"/>
  <text x="312" y="130" font-size="13" fill="#111"><tspan font-weight="700">B</tspan>  BPE + trigram (add-one / Kneser-Ney) — ppl 408</text>
  <rect x="300" y="152" width="300" height="42" rx="6" fill="#ffffff" stroke="#7a99c4"/>
  <text x="312" y="178" font-size="13" fill="#111"><tspan font-weight="700">A</tspan>  feedforward neural LM (SGD) — ppl 209</text>
  <rect x="300" y="200" width="300" height="42" rx="6" fill="#ffffff" stroke="#7a99c4"/>
  <text x="312" y="226" font-size="13" fill="#111"><tspan font-weight="700">C</tspan>  GPT-2 fine-tuned — ppl 83</text>
  <rect x="300" y="248" width="300" height="42" rx="6" fill="#eaf5ec" stroke="#4a9d5b"/>
  <text x="312" y="274" font-size="13" fill="#111"><tspan font-weight="700">D</tspan>  GPT-2 quantized (INT8) — ppl 129 ★</text>

  <rect x="690" y="150" width="300" height="100" rx="8" fill="#ffffff" stroke="#7a99c4"/>
  <text x="840" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Results table (R4)</text>
  <text x="840" y="206" text-anchor="middle" font-size="12" fill="#555">perplexity · top-3 accuracy</text>
  <text x="840" y="226" text-anchor="middle" font-size="12" fill="#555">latency · size — same test text</text>

  <line x1="214" y1="150" x2="296" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="214" y1="166" x2="296" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="196" x2="686" y2="196" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bridge -->
  <text x="662" y="334" font-size="12" font-style="italic" fill="#4a9d5b">GPT-2 → pushed to Hugging Face Hub → served live</text>
  <line x1="450" y1="290" x2="450" y2="362" stroke="#4a9d5b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LIVE APP SECTION -->
  <rect x="24" y="362" width="992" height="332" rx="10" fill="#fbf6f3" stroke="#e8cfc0"/>
  <text x="44" y="390" font-size="16" font-weight="700" fill="#a8602b">LIVE APP — Smart Keyboard (Gradio, runs on CPU)</text>

  <rect x="44" y="412" width="150" height="74" rx="8" fill="#ffffff" stroke="#c99a7a"/>
  <text x="119" y="442" text-anchor="middle" font-size="13" font-weight="600" fill="#111">User types</text>
  <text x="119" y="462" text-anchor="middle" font-size="12" fill="#555">a sentence</text>
  <text x="119" y="478" text-anchor="middle" font-size="12" fill="#555">(context)</text>

  <!-- three models in parallel -->
  <rect x="246" y="398" width="300" height="40" rx="7" fill="#ffffff" stroke="#c99a7a"/>
  <text x="396" y="423" text-anchor="middle" font-size="13" fill="#111">n-gram — top-3 next words</text>
  <rect x="246" y="444" width="300" height="40" rx="7" fill="#ffffff" stroke="#c99a7a"/>
  <text x="396" y="469" text-anchor="middle" font-size="13" fill="#111">feedforward neural LM — top-3</text>
  <rect x="246" y="490" width="300" height="40" rx="7" fill="#eaf5ec" stroke="#4a9d5b"/>
  <text x="396" y="515" text-anchor="middle" font-size="13" fill="#111">Quantized INT8 GPT-2 — top-3</text>

  <rect x="596" y="430" width="180" height="70" rx="8" fill="#ffffff" stroke="#c99a7a"/>
  <text x="686" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Post-processing</text>
  <text x="686" y="476" text-anchor="middle" font-size="12" fill="#555">keep real words</text>
  <text x="686" y="492" text-anchor="middle" font-size="12" fill="#555">measure latency</text>

  <rect x="826" y="430" width="168" height="70" rx="8" fill="#ffffff" stroke="#c99a7a"/>
  <text x="910" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Gradio UI</text>
  <text x="910" y="476" text-anchor="middle" font-size="12" fill="#555">3 cards · top-3</text>
  <text x="910" y="492" text-anchor="middle" font-size="12" fill="#555">click to insert</text>

  <line x1="194" y1="449" x2="242" y2="418" stroke="#444" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="194" y1="461" x2="242" y2="464" stroke="#444" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="194" y1="473" x2="242" y2="510" stroke="#444" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="546" y1="464" x2="592" y2="464" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="776" y1="465" x2="822" y2="465" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="596" y="560" width="180" height="54" rx="8" fill="#ffffff" stroke="#9ab0d0"/>
  <text x="686" y="584" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Hugging Face Hub</text>
  <text x="686" y="602" text-anchor="middle" font-size="11" fill="#555">tia88na/gpt2-keyboard</text>
  <line x1="686" y1="560" x2="686" y2="503" stroke="#9ab0d0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="694" y="536" font-size="11" font-style="italic" fill="#6b6b6b">loaded + quantized at startup</text>

  <text x="910" y="524" text-anchor="middle" font-size="11" fill="#777">↩ clicking inserts the word</text>
</svg>
